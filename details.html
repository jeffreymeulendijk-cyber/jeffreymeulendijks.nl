<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotogalerij | The Magenta Kiwi</title>

<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="shortcut icon" type="image/png" href="favicon.png?v=3">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    overflow-x: hidden;
    width: 100%;
  }

  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background-color: #090a0f;
    color: #f8fafc;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  header {
    padding: 1.5rem 1rem;
    text-align: center;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 0.8rem;
    color: #c5a059;
    border-bottom: 1px solid rgba(197, 160, 89, 0.15);
  }

  header a {
    color: #c5a059;
    text-decoration: none;
    transition: color 0.2s;
  }

  header a:hover {
    color: #d4af37;
  }

  .container {
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 3rem 1.5rem;
  }

  h1 {
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    color: #ffffff;
    text-align: center;
    margin-bottom: 0.5rem;
  }

  .subtitle {
    font-size: 0.9rem;
    color: #94a3b8;
    text-align: center;
    margin-bottom: 3rem;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.5rem;
  }

  .gallery-item {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(197, 160, 89, 0.2);
    cursor: pointer;
    background: #000000;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }

  .gallery-item:hover {
    transform: translateY(-4px);
    border-color: #c5a059;
  }

  .gallery-item img {
    width: 100%;
    height: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
  }

  footer {
    padding: 2rem 1rem;
    text-align: center;
    font-size: 0.85rem;
    color: #64748b;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
  }

  footer a {
    color: #94a3b8;
    text-decoration: none;
  }

  /* Pop-up scherm voor vergroting */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
  }

  .lightbox img {
    max-width: 90%;
    max-height: 85vh;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
</style>
</head>
<body>

  <header>
    <a href="index.html">&larr; Terug naar de Private Collection</a>
  </header>

  <main class="container">
    <h1>Fotogalerij &amp; Details</h1>
    <div class="subtitle">Klik op een afbeelding voor een vergroting</div>

    <div class="gallery-grid">
      <div class="gallery-item" onclick="openLightbox('1.png')"><img src="1.png" alt="Detail 1"></div>
      <div class="gallery-item" onclick="openLightbox('2.png')"><img src="2.png" alt="Detail 2"></div>
      <div class="gallery-item" onclick="openLightbox('3.png')"><img src="3.png" alt="Detail 3"></div>
      <div class="gallery-item" onclick="openLightbox('4.png')"><img src="4.png" alt="Detail 4"></div>
      <div class="gallery-item" onclick="openLightbox('5.png')"><img src="5.png" alt="Detail 5"></div>
      <div class="gallery-item" onclick="openLightbox('6.png')"><img src="6.png" alt="Detail 6"></div>
      <div class="gallery-item" onclick="openLightbox('7.png')"><img src="7.png" alt="Detail 7"></div>
      <div class="gallery-item" onclick="openLightbox('8.png')"><img src="8.png" alt="Detail 8"></div>
    </div>
  </main>

  <footer>
    &copy; Jeffrey Meulendijks &mdash; <a href="index.html">Terug naar de Private Collection</a>
  </footer>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="Vergrote weergave">
  </div>

  <script>
    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }
    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }
  </script>

</body>
</html>
