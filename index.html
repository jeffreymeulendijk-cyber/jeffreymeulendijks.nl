<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeffrey's paradijs</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1f2937, #111827);
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 2.5rem 3.5rem 3rem;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    max-width: 90%;
  }
  .avatar {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    margin: 0 auto 1.5rem;
    overflow: hidden;
    border: 4px solid #ec4899;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  h1 {
    margin: 0;
    font-size: 2.2rem;
    color: #111827;
  }
  p {
    margin-top: 0.5rem;
    color: #6b7280;
    font-size: 1rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">
      <img src="jeffrey.png" alt="Jeffrey">
    </div>
    <h1>welkom op Jeffrey's paradijs!</h1>
  </div>
</body>
</html>
