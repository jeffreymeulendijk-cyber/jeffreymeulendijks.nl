<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeffrey's paradijs</title>
<style>
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 1rem;
    position: relative;
    overflow-x: hidden;
  }

  /* Vaste achtergrond die niet verspringt op mobiel */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: url('achtergrond.jpg') no-repeat center center;
    background-size: cover;
    z-index: -1;
    transform: translateZ(0);
    will-change: transform;
  }

  .card {
    /* Iets minder transparant (0.75) voor een strakke, chique look */
    background: rgba(240, 248, 255, 0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    
    border-radius: 20px;
    padding: 2.5rem 2rem;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    max-width: 420px;
    width: 100%;
  }

  .avatar {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    margin: 0 auto 1.25rem;
    overflow: hidden;
    border: 4px solid #00b4d8;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  h1 {
    margin: 0;
    font-size: 1.8rem;
    color: #0f172a;
  }

  .subtitle {
    margin-top: 0.5rem;
    color: #0284c7;
    font-weight: 600;
    font-size: 1.05rem;
  }

  p.bio {
    margin-top: 1rem;
    color: #1e293b;
    font-size: 0.95rem;
    line-height: 1.5;
    font-weight: 500;
  }

  .links {
    margin-top: 1.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .btn {
    display: block;
    padding: 0.85rem 1.5rem;
    background-color: rgba(224, 242, 254, 0.9);
    color: #0369a1;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 1rem;
    transition: all 0.2s ease;
    border: 1px solid rgba(186, 230, 253, 0.7);
  }

  .btn:hover {
    background-color: #00b4d8;
    color: #ffffff;
    transform: translateY(-2px);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">
      <img src="jeffrey.jpg" alt="Jeffrey">
    </div>
    <h1>Welkom op Jeffrey's paradijs!</h1>
    <div class="subtitle">Web Developer / Specialist</div>
    <p class="bio">
      Welkom op mijn persoonlijke website. Als je meer wil weten, klik dan op de onderstaande knoppen.
    </p>

    <div class="links">
      <a href="https://www.linkedin.com/in/jeffrey-meulendijks-181b79132/" target="_blank" class="btn">LinkedIn</a>
      <a href="https://wa.me/31613985013" target="_blank" class="btn">WhatsApp</a>
      <a href="mailto:jeffreymeulendijk@gmail.com" class="btn">E-mail</a>
    </div>
  </div>
</body>
</html>
